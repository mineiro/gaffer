[package]
name = "gaffer"
description = "Command-line control for the gaffer daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
futures-util = "0.3.33"
gaffer-core.workspace = true
rustix = { version = "1.1.4", features = ["process"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
