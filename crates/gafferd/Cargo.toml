[package]
name = "gafferd"
description = "The gaffer daemon: owns discovery and light state, speaks D-Bus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.33"
gaffer-core.workspace = true
mdns-sd = "0.20.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
