version: 2

updates:
  # Rust dependencies. Cargo.lock is committed and distro packaging vendors from
  # it, so a stale lockfile ships straight into an RPM — these updates are the
  # supply chain, not housekeeping.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine churn, individual PRs for majors so they get
      # read properly.
      minor-and-patch:
        update-types:
          - minor
          - patch
    commit-message:
      prefix: "deps"

  # Workflow actions are pinned to commit SHAs, which means they do NOT pick up
  # security fixes on their own. This is what keeps the pins current; without
  # it, pinning trades one risk for another.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
