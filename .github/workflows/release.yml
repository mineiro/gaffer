name: Release

# Pushing a `v*` tag is the release event, and the archive GitHub publishes for
# it is what downstream packaging consumes — see github.com/mineiro/rpms. This
# repository has no opinion about packaging beyond producing that archive.
#
# Deliberately not triggered by a GitHub Release created through the web UI:
# the tag is the source of truth, so there is one way to cut a release and it
# leaves a signed-off commit behind.
on:
  push:
    tags:
      - 'v*'

# Deny by default; the one job that needs to write opts in below.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its notes. Nothing else is needed:
      # the source archives are generated by GitHub itself.
      contents: write
    steps:
      # Pinned to an immutable commit, not a tag — see the note in ci.yml.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gh` is given a token explicitly below, so the checkout does not
          # need to leave one in .git/config where a build script could read it.
          persist-credentials: false

      # A tag that disagrees with the tree is the classic half-finished
      # release: v0.3.0 pushed while Cargo.toml still says 0.2.0, shipping a
      # package whose own version contradicts its name. Cheaper to fail here
      # than to yank a release.
      - name: Check the tag matches the tree
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          nix=$(grep -m1 'version = ' nix/package.nix | cut -d'"' -f2)

          echo "tag=$tag crate=$crate nix=$nix"
          fail=0
          [ "$crate" = "$tag" ] || { echo "::error::Cargo.toml says $crate, tag says $tag"; fail=1; }
          [ "$nix"   = "$tag" ] || { echo "::error::nix/package.nix says $nix, tag says $tag"; fail=1; }
          exit $fail

      - name: Install toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      # A tag can point at any commit, including one that never passed CI on
      # main. Re-running the gate here means a published release has always
      # been built and tested as tagged, which is the claim a release makes.
      - name: Verify the tagged tree
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

      # Release notes come from CHANGELOG.md, which is the canonical record.
      # The script exits non-zero when the version has no section, so a release
      # cannot be published with an empty body.
      - name: Extract release notes
        run: .github/release-notes.sh "${GITHUB_REF_NAME#v}" > "${RUNNER_TEMP}/notes.md"

      # `gh` rather than a third-party action: releasing is the one job with a
      # writable token, so it runs the least third-party code of anything here.
      # Create, or update in place if the release already exists. A tag that
      # has to be moved — because the first attempt was cut wrong — should
      # re-run this cleanly rather than failing on "release already exists" and
      # leaving a red run next to a green release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title="gaffer ${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release exists; updating it in place"
            # --draft=false is not redundant. Deleting a tag to move it makes
            # GitHub demote its release to a draft, and editing does not undo
            # that on its own — so a re-cut release would quietly stop being
            # visible while still looking published to anyone reading the run.
            gh release edit "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --draft=false \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$title" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --verify-tag
          fi
